name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: procurement_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    
    - name: Install Dependencies
      run: npm ci

    - name: Install Workflow Socket Client Dependencies
      run: npm ci --prefix ../frontend --ignore-scripts

    - name: Initialize Database
      run: mysql -h 127.0.0.1 -u root -proot procurement_db < tests/fixtures/schema.sql
      
    - name: Run Backend Tests
      run: npm test
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: procurement_db
        PORT: 5005

    - name: Run Isolated Workflow and Remediation Tests
      run: |
        npm run test:workflows
        node scripts/testAllFlows.mjs
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: procurement_db
        PORT: 5005

  frontend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    
    - name: Install Dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run Component Tests
      run: |
        npm test -- --run
        npm test -- --run --config audit/vitest.config.mjs

    - name: Build Frontend
      run: npm run build

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deploy to Custom VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          cd /var/www/Procurement
          
          # Pull latest code
          git fetch origin main
          git reset --hard origin/main
          
          # Deploy Backend and Frontend using Docker Compose
          docker compose --env-file /opt/procurement/.env.prod up -d --build backend frontend
          
          sleep 10
          
          # Verify health
          curl -i http://127.0.0.1:5001/api/health
